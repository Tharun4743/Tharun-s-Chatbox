services:
  - type: web
    name: tharunchatbox
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        value: https://tharunchatbox.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://tharunchatbox.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CHAT_API_URL
        value: /api/chat
      - key: NEXT_PUBLIC_CHAT_HISTORY_API_URL
        value: /api/chats
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "ChatBox <onboarding@resend.dev>"
      - key: NEXT_PUBLIC_APP_NAME
        value: "Techy Tharun's Chatbox"
    healthCheckPath: /api/auth/session
    autoDeploy: true
