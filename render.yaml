services:
  - type: web
    name: tharunchatbox
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://tharunchatbox.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://tharunchatbox.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CHAT_API_URL
        value: /api/chat
      - key: NEXT_PUBLIC_CHAT_HISTORY_API_URL
        value: /api/chats
    healthCheckPath: /api/auth/session
    autoDeploy: true
